spring.application.name=sqlanalyzer-webapp
server.port=8080

# --- Sesión / cookies ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# Activar en producción detrás de HTTPS:
# server.servlet.session.cookie.secure=true

# --- Subida de logs ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Base de datos de la aplicación (usuarios) ---
spring.datasource.url=jdbc:h2:file:./data/sqlanalyzer;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Usuarios iniciales (solo se crean si la tabla está vacía) ---
app.security.admin.username=${APP_ADMIN_USER:admin}
app.security.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.security.analyst.username=${APP_ANALYST_USER:analista}
app.security.analyst.password=${APP_ANALYST_PASSWORD:analista123}

# --- API Python (única vía de acceso a las BBDD) ---
app.api.url=${API_URL:http://localhost:8000}
app.api.timeout=30s
