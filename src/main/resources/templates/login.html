<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="login-body">
<main class="login-card">
    <div class="brand brand-lg">
        <span class="brand-mark">SQL</span>
        <span class="brand-name">Analyzer</span>
    </div>
    <p class="muted">Generación, análisis y optimización de consultas PostgreSQL</p>

    <div th:if="${param.error}" class="alert alert-error" role="alert">
        Usuario o contraseña incorrectos.
    </div>
    <div th:if="${param.logout}" class="alert alert-info" role="status">
        Has cerrado sesión correctamente.
    </div>

    <form th:action="@{/login}" method="post" class="form">
        <label class="field">
            <span>Usuario</span>
            <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label class="field">
            <span>Contraseña</span>
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <p class="muted login-foot">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
</main>
</body>
</html>
