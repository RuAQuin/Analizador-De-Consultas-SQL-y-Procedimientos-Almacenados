<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Logs JPA / Hibernate')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="content">
        <header class="page-head">
            <span class="eyebrow">Módulo 03</span>
            <h1>Logs JPA / Hibernate</h1>
            <p class="muted">Carga el .txt de logs, localiza las consultas y guarda su análisis.</p>
        </header>

        <div th:replace="~{fragments/layout :: mensajes}"></div>

        <form th:action="@{/logs}" method="post" enctype="multipart/form-data" class="panel form">
            <label class="dropzone">
                <input type="file" name="fichero" accept=".txt,text/plain" required>
                <span class="dropzone-title">Selecciona el fichero de logs</span>
                <span class="muted">Formato .txt · máximo 20 MB</span>
            </label>
            <button type="submit" class="btn btn-primary">Cargar y analizar</button>
        </form>

        <section class="panel">
            <h2 class="panel-title">Consultas encontradas</h2>
            <table class="table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Línea</th>
                    <th>Consulta</th>
                    <th>Incidencias</th>
                    <th>Coste estimado</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td colspan="5" class="empty-row">Todavía no se ha analizado ningún fichero.</td>
                </tr>
                </tbody>
            </table>
        </section>

        <section class="panel">
            <h2 class="panel-title">Análisis guardados</h2>
            <div class="empty">El histórico de análisis de logs aparecerá aquí.</div>
        </section>
    </main>
</div>
</body>
</html>
