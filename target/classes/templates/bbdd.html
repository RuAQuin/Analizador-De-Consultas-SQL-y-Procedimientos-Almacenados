<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Creación de BBDD')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="content">
        <header class="page-head">
            <span class="eyebrow">Módulo 01</span>
            <h1>Creación de BBDD</h1>
            <p class="muted">Generar la base de datos, insertar datos según la petición y exportar con pg_dump.</p>
        </header>

        <div th:replace="~{fragments/layout :: mensajes}"></div>

        <div class="grid-2">
            <form th:action="@{/bbdd}" th:object="${form}" method="post" class="panel form" novalidate>
                <h2 class="panel-title">Parámetros</h2>

                <label class="field">
                    <span>Nombre de la base de datos</span>
                    <input type="text" th:field="*{nombreBbdd}" placeholder="tienda_demo"
                           th:classappend="${#fields.hasErrors('nombreBbdd')} ? 'invalid'">
                    <small class="field-error" th:if="${#fields.hasErrors('nombreBbdd')}" th:errors="*{nombreBbdd}"></small>
                </label>

                <label class="field">
                    <span>Definición de tablas (DDL)</span>
                    <textarea th:field="*{definicionTablas}" rows="10" class="code" spellcheck="false"
                              placeholder="CREATE TABLE cliente (&#10;  id SERIAL PRIMARY KEY,&#10;  nombre VARCHAR(100) NOT NULL&#10;);"
                              th:classappend="${#fields.hasErrors('definicionTablas')} ? 'invalid'"></textarea>
                    <small class="field-error" th:if="${#fields.hasErrors('definicionTablas')}" th:errors="*{definicionTablas}"></small>
                </label>

                <label class="field">
                    <span>Petición de datos</span>
                    <textarea th:field="*{peticionDatos}" rows="3"
                              placeholder="Ej.: clientes con nombres españoles, pedidos de los últimos 6 meses…"></textarea>
                    <small class="field-error" th:if="${#fields.hasErrors('peticionDatos')}" th:errors="*{peticionDatos}"></small>
                </label>

                <div class="row">
                    <label class="field field-sm">
                        <span>Filas por tabla</span>
                        <input type="number" th:field="*{filasPorTabla}" min="0" max="100000"
                               th:classappend="${#fields.hasErrors('filasPorTabla')} ? 'invalid'">
                        <small class="field-error" th:if="${#fields.hasErrors('filasPorTabla')}" th:errors="*{filasPorTabla}"></small>
                    </label>
                    <label class="check">
                        <input type="checkbox" th:field="*{exportarPgDump}">
                        <span>Exportar script con pg_dump</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">Generar base de datos</button>
            </form>

            <section class="panel">
                <h2 class="panel-title">Resultado</h2>
                <ol class="steps">
                    <li><span class="step-dot"></span>Generar BBDD</li>
                    <li><span class="step-dot"></span>Insertar datos</li>
                    <li><span class="step-dot"></span>Exportar con pg_dump</li>
                </ol>
                <div class="empty">
                    Aquí aparecerá el progreso y el enlace de descarga del script exportado.
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
