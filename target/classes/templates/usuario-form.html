<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${esNuevo} ? 'Nuevo usuario' : 'Editar usuario')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <main class="content">
        <header class="page-head">
            <span class="eyebrow">Administración</span>
            <h1 th:text="${esNuevo} ? 'Nuevo usuario' : 'Editar usuario'">Usuario</h1>
        </header>

        <div th:replace="~{fragments/layout :: mensajes}"></div>

        <form th:action="${esNuevo} ? @{/usuarios} : @{/usuarios/{id}(id=${form.id})}"
              th:object="${form}" method="post" class="panel form form-narrow" novalidate>

            <label class="field">
                <span>Usuario</span>
                <input type="text" th:field="*{username}" autocomplete="username"
                       th:classappend="${#fields.hasErrors('username')} ? 'invalid'">
                <small class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
            </label>

            <label class="field">
                <span th:text="${esNuevo} ? 'Contraseña' : 'Nueva contraseña (déjalo en blanco para no cambiarla)'">Contraseña</span>
                <input type="password" th:field="*{password}" autocomplete="new-password"
                       th:classappend="${#fields.hasErrors('password')} ? 'invalid'">
                <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
            </label>

            <label class="field">
                <span>Rol</span>
                <select th:field="*{rol}">
                    <option value="ADMIN">Administrador</option>
                    <option value="ANALYST">Analista</option>
                </select>
            </label>

            <label class="check">
                <input type="checkbox" th:field="*{habilitado}">
                <span>Cuenta habilitada</span>
            </label>

            <div class="row">
                <button type="submit" class="btn btn-primary"
                        th:text="${esNuevo} ? 'Crear usuario' : 'Guardar cambios'">Guardar</button>
                <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
