[project]
name = "sqlanalyzer-api"
version = "0.1.0"
description = "API Python del Analizador SQL (TFG): plano de datos y plano de consultas"
requires-python = ">=3.11"
dependencies = [
    "pglast>=7",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
